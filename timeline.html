<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>运营商自研一体机 · 发布时间轴</title>
<meta name="description" content="三家运营商 20 款自研一体机按发布先后均匀排布的可拖动时间轴：默认只露名字与运营商，悬停节点展开详情。">
<style>
:root{
  --blue:#2456d8;--ink:#1a1d21;--mut:#6b7280;--line:#e3e6ea;--amber:#b5730f;
  --ax:44%;                       /* 时间轴在舞台中的高度位置 */
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#fbfbfc;color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- 头部 ---------- */
header{
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding:22px 32px 16px;border-bottom:1px solid var(--line);background:#fff;flex:none;
}
.kicker{font-size:11px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:5px 0 6px}
h1 .n{color:var(--blue)}
.meta{font-size:12.5px;color:var(--mut)}
.meta b{color:var(--ink);font-weight:600}
.trend{display:flex;gap:8px;margin-top:9px}
.trend span{
  font-size:11.5px;padding:3px 10px;border-radius:20px;background:#f0f4ff;color:var(--blue);font-weight:600;
}
.trend span.b{background:#fff4e5;color:var(--amber)}
.nav{display:flex;gap:16px;font-size:12.5px;flex:none;padding-bottom:2px}
.nav a{color:var(--blue);text-decoration:none;border-bottom:1px dotted rgba(36,86,216,.45)}
.nav a:hover{border-bottom-style:solid}

/* ---------- 舞台 ---------- */
.stage{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.grabbing{cursor:grabbing}
.world{position:absolute;top:0;bottom:0;left:0;will-change:transform}

.axis{
  position:absolute;left:0;right:0;top:var(--ax);height:2px;
  background:linear-gradient(90deg,#dfe3e8,#c9cfd7 50%,#dfe3e8);
  transform-origin:left center;animation:axisIn 1s var(--ease) backwards;
}
@keyframes axisIn{from{transform:scaleX(0)}}

/* ---------- 节点 ---------- */
.node{position:absolute;top:0;bottom:0;width:240px;transform:translateX(-50%);transition:opacity .35s}
.node .stem{
  position:absolute;left:50%;bottom:calc(100% - var(--ax));width:2px;margin-left:-1px;height:15px;
  background:#d8dde3;
}
.node .dot{
  position:absolute;left:50%;bottom:calc(100% - var(--ax) - 6px);width:12px;height:12px;margin-left:-6px;
  border-radius:50%;background:#fff;border:3px solid var(--cc,#999);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease);
}
.node .cap{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(100% - var(--ax) + 21px);
  width:236px;text-align:center;cursor:default;
}
.cap .date{
  display:block;font-size:11px;color:var(--mut);letter-spacing:.06em;margin-bottom:3px;
  font-variant-numeric:tabular-nums;
}
.cap .name{display:block;font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.cap .tag{
  display:inline-flex;align-items:center;gap:5px;margin-top:5px;
  font-size:11px;font-weight:600;color:var(--cc);
}
.cap .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}

/* 入场错峰 */
.node .cap>*{animation:rise .55s var(--ease) backwards;animation-delay:calc(.35s + var(--i)*65ms)}
.node .stem,.node .dot{animation:rise .5s var(--ease) backwards;animation-delay:calc(.3s + var(--i)*65ms)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}}

/* ---------- 年份刻度（趋势） ---------- */
.divider{
  position:absolute;left:50%;top:calc(var(--ax) - 200px);height:410px;width:1px;
  background:repeating-linear-gradient(180deg,#e2e6eb 0 5px,transparent 5px 11px);
}
.yr{
  position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--ax) + 16px);
  font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.05em;
  font-variant-numeric:tabular-nums;
}
.yr small{display:block;text-align:center;font-size:9.5px;font-weight:600;color:#b3bac4;letter-spacing:.1em;margin-top:1px}

/* ---------- 悬停卡片 ---------- */
.card{
  position:absolute;left:50%;top:calc(var(--ax) + 46px);width:334px;
  transform:translateX(-50%) translateY(12px) scale(.92);transform-origin:top center;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(16,21,29,.10),0 2px 6px rgba(16,21,29,.05);
  padding:15px 17px 13px;text-align:left;cursor:default;
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .38s var(--ease);
  z-index:5;
}
.node:hover .dot,.node.open .dot{transform:scale(1.4);box-shadow:0 0 0 5px color-mix(in srgb,var(--cc) 16%,transparent)}
.node:hover .card,.node.open .card{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.card h4{font-size:14px;font-weight:800;line-height:1.45;letter-spacing:-.01em}
.card .sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:7px 0 9px;font-size:11.5px;color:var(--mut)}
.card .sub .cname{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--cc)}
.card .sub .cname::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}
.bdg{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600}
.b-lc{background:#eef3ff;color:var(--blue)}
.b-cl{background:#f0eefc;color:#5b4bc4}
.b-sc{background:#fff4e5;color:var(--amber)}
.b-os{background:#e8f6f0;color:#1e7f4f}
.card ul{list-style:none}
.card li{font-size:12.5px;color:#3c4149;line-height:1.62;padding-left:12px;position:relative;margin:3px 0}
.card li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--cc);opacity:.6}
.card .ev{font-size:11px;color:#8a919c;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
.card .ev .wk{color:var(--amber)}
.card .hotline{
  margin-top:8px;font-size:11.5px;font-weight:700;color:var(--blue);
  background:#f0f4ff;border-radius:7px;padding:6px 9px;
}

/* 悬停时其余节点降透明度 */
.stage:has(.node:hover) .node:not(:hover),
.stage:has(.node.open) .node:not(.open){opacity:.3}

/* ---------- 提示 & 控制 ---------- */
.hint{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);
  border-radius:100px;padding:7px 16px;pointer-events:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(16,21,29,.05);
  transition:opacity .5s;
}
.hint.hide{opacity:0}
.reset{
  position:absolute;top:16px;right:20px;font-size:11.5px;color:var(--mut);
  background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer;
  font-family:inherit;transition:color .2s,border-color .2s;
}
.reset:hover{color:var(--blue);border-color:var(--blue)}

.foot{
  flex:none;display:flex;justify-content:space-between;gap:16px;
  padding:9px 32px;border-top:1px solid var(--line);background:#fff;
  font-size:11px;color:#9aa1ab;
}

@media(max-width:760px){
  :root{--ax:38%}
  header{flex-direction:column;align-items:flex-start;gap:8px;padding:16px 20px 12px}
  h1{font-size:20px}
  .nav{flex-wrap:wrap}
  .node{width:200px}
  .cap .name{font-size:12.5px}
  .card{width:300px;padding:13px 14px 11px}
  .divider{top:calc(var(--ax) - 150px);height:360px}
  .foot{padding:8px 20px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

/* ================= 渲染 ================= */
var stage = document.getElementById("stage");
var world = document.getElementById("world");
var GAP = 240, PAD = 0, worldW = 0;

function yearOf(d){ return parseInt(d.slice(0,4),10); }

function build(){
  var n = DATA.length;
  PAD = Math.max((stage.clientWidth - 260) / 2, 48);
  if(stage.clientWidth < 760) GAP = 200; else GAP = 240;
  worldW = PAD * 2 + (n - 1) * GAP;
  world.style.width = worldW + "px";

  var html = "", prevY = null;
  for(var i = 0; i < n; i++){
    var it = DATA[i], cm = CM[it.c], x = PAD + i * GAP, y = yearOf(it.d);
    var showYr = (y !== prevY);
    prevY = y;

    var facts = "";
    for(var f = 0; f < it.facts.length; f++) facts += "<li>" + it.facts[f] + "</li>";

    html += ''
    + '<div class="node' + (it.hot ? " hot" : "") + '" data-i="' + i + '" style="left:' + x + 'px;--i:' + i + ';--cc:' + cm.col + '">'
    +   (showYr ? '<div class="divider"></div><div class="yr">' + y + '<small>' + (i===0 ? "起点" : "") + '</small></div>' : '')
    +   '<div class="cap">'
    +     '<span class="date">' + it.d + '</span>'
    +     '<span class="name">' + it.name + '</span>'
    +     '<span class="tag">' + cm.n + '</span>'
    +   '</div>'
    +   '<div class="stem"></div>'
    +   '<div class="dot"></div>'
    +   '<div class="card">'
    +     '<h4>' + it.full + '</h4>'
    +     '<div class="sub"><span class="cname">' + cm.n + '</span><span>' + it.d + '</span><span class="bdg b-' + it.l + '">' + LAYER[it.l] + '</span></div>'
    +     '<ul>' + facts + '</ul>'
    +     (it.hotTxt ? '<div class="hotline">' + it.hotTxt + '</div>' : '')
    +     '<div class="ev">' + it.ev + (it.wkTxt ? ' · <span class="wk">⚠ ' + it.wkTxt + '</span>' : '') + '</div>'
    +   '</div>'
    + '</div>';
  }
  // 轴+节点
  world.innerHTML = '<div class="axis"></div>' + html;
}

build();

var hinted = false;

function minPan(){ return Math.min(0, stage.clientWidth - worldW); }
function clampPan(v){ return Math.max(minPan(), Math.min(0, v)); }
function apply(){ world.style.transform = "translate3d(" + pan + "px,0,0)"; }

function momentum(){
  cancelAnimationFrame(rafId);
  (function tick(){
    if(Math.abs(vel) < 0.02){ vel = 0; return; }
    pan = clampPan(pan + vel * 16);
    vel *= 0.94;
    if(pan === 0 || pan === minPan()){ vel = 0; }
    apply();
    rafId = requestAnimationFrame(tick);
  })();
}

stage.addEventListener("pointerdown", function(e){
  if(e.target.closest(".card") || e.target.closest(".reset")) return;
  dragging = true; moved = 0;
  stage.classList.add("grabbing");
  stage.setPointerCapture(e.pointerId);
  startX = lastX = e.clientX; startPan = pan; lastT = performance.now();
  vel = 0; cancelAnimationFrame(rafId);
  // 点击空白处收起触屏卡片
  if(!e.target.closest(".node")) closeOpen();
});
stage.addEventListener("pointermove", function(e){
  if(!dragging) return;
  var dx = e.clientX - startX;
  moved = Math.max(moved, Math.abs(dx));
  pan = clampPan(startPan + dx);
  var now = performance.now(), dt = now - lastT;
  if(dt > 0){ vel = (e.clientX - lastX) / dt; lastX = e.clientX; lastT = now; }
  apply();
  if(moved > 8 && !hinted){ hinted = true; hint.classList.add("hide"); }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  stage.classList.remove("grabbing");
  momentum();
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* 触屏点按：未发生拖动时切换卡片 */
stage.addEventListener("click", function(e){
  if(moved > 8) return;
  var node = e.target.closest(".node");
  if(!node) return;
  var was = node.classList.contains("open");
  closeOpen();
  if(!was) node.classList.add("open");
});
function closeOpen(){
  var o = world.querySelectorAll(".node.open");
  for(var i = 0; i < o.length; i++) o[i].classList.remove("open");
}

/* 滚轮横向平移 */
stage.addEventListener("wheel", function(e){
  e.preventDefault();
  vel = 0; cancelAnimationFrame(rafId);
  pan = clampPan(pan - (e.deltaY + e.deltaX) * 1.1);
  apply();
  if(!hinted){ hinted = true; hint.classList.add("hide"); }
}, {passive:false});

/* 键盘 */
document.addEventListener("keydown", function(e){
  if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  vel = 0; cancelAnimationFrame(rafId);
  pan = clampPan(pan + (e.key === "ArrowRight" ? -1 : 1) * GAP);
  apply();
});

/* 复位 */
document.getElementById("reset").addEventListener("click", function(){
  vel = 0; cancelAnimationFrame(rafId);
  pan = clampPan(0); apply();
});

/* 自适应 */
window.addEventListener("resize", function(){
  var ratio = worldW ? pan / worldW : 0;
  build();
  pan = clampPan(ratio * worldW);
  apply();
});

apply();
</script>
</body>
</html>
